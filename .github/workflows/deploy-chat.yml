# Manual deployment trigger for the current gptChum chat bundle.
name: Deploy gptChum

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/deploy-chat.yml

permissions:
  contents: write
  pages: write

concurrency:
  group: deploy-chat
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Check out gptChum develop
        uses: actions/checkout@v4
        with:
          repository: junwin/gptchum
          ref: develop
          path: gptchum-source
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gptchum-source/package-lock.json

      - name: Build gptChum
        working-directory: gptchum-source
        run: |
          npm ci
          npm run build

      - name: Copy build into chat
        run: |
          rsync -a --delete gptchum-source/dist/ chat/
          test -f chat/index.html
          git add -A chat

      - name: Commit changed build files
        run: |
          if git diff --cached --quiet; then
            echo 'chat/ is already up to date'
            exit 0
          fi
          source_sha=$(git -C gptchum-source rev-parse --short=12 HEAD)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Deploy gptChum ${source_sha}"
          git push origin HEAD:master

      # A GITHUB_TOKEN push does not trigger branch-based Pages publishing.
      - name: Request GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
