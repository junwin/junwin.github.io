name: Generate image thumbnails

on:
  push:
    branches: [master]
    paths:
      - 'assets/images/**'
      - '.github/workflows/generate-thumbs.yml'
      - 'scripts/make_thumbs.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - run: python scripts/make_thumbs.py
      - name: Commit thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/thumbs
          if git diff --cached --quiet; then
            echo "No thumbnail changes."
          else
            git commit -m "Auto-generate image thumbnails [skip ci]"
            git push
          fi
